services:
  backend:
    build: ./backend
    container_name: voice-assistant-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/.env:/app/.env
      - whisper_cache:/root/.cache
      - sqlite_data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - DB_URL=sqlite+aiosqlite:////app/data/voice_assistant.db
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: voice-assistant-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  whisper_cache:
  sqlite_data:

